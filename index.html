<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>STANFORD — Immersive Campus</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#8ea5ae;
    font-family:Arial,Helvetica,sans-serif;
    color:white;
}

body{
    touch-action:none;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    display:block;
}


/* =========================
   LOADING
========================= */

#loading{
    position:fixed;
    inset:0;
    z-index:1000;

    background:
        radial-gradient(
            circle at center,
            #202629 0%,
            #101416 55%,
            #080a0b 100%
        );

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    transition:opacity 1s ease;
}

.loadingTitle{
    font-family:Georgia,serif;
    font-size:clamp(42px,8vw,95px);
    letter-spacing:4px;
}

.loadingSubtitle{
    margin-top:15px;
    font-size:9px;
    letter-spacing:5px;
    opacity:.55;
}

.loadingBar{
    width:230px;
    height:2px;
    background:rgba(255,255,255,.15);
    margin-top:35px;
    overflow:hidden;
}

.loadingBar span{
    display:block;
    height:100%;
    width:0;
    background:white;
    animation:load 2s ease forwards;
}

@keyframes load{
    from{width:0}
    to{width:100%}
}


/* =========================
   TOP UI
========================= */

#top{
    position:fixed;
    top:0;
    left:0;
    right:0;

    z-index:20;

    padding:25px 35px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    pointer-events:none;
}

.logo{
    font-family:Georgia,serif;
    font-size:23px;
    letter-spacing:2px;
}

.logoSmall{
    display:block;
    font-family:monospace;
    font-size:8px;
    letter-spacing:3px;
    opacity:.55;
    margin-bottom:4px;
}

#chapter{
    font-family:monospace;
    font-size:11px;
    opacity:.7;
}


/* =========================
   INTRO
========================= */

#intro{
    position:fixed;
    z-index:30;

    left:7vw;
    bottom:11vh;

    transition:
        opacity .8s ease,
        transform .8s ease;
}

.introSmall{
    font-family:monospace;
    font-size:9px;
    letter-spacing:4px;
    opacity:.65;
    margin-bottom:22px;
}

#intro h1{
    font-family:Georgia,serif;
    font-size:clamp(58px,10vw,145px);
    font-weight:normal;
    line-height:.82;
    letter-spacing:-5px;
}

#intro h1 span{
    opacity:.55;
}

#intro p{
    margin-top:30px;
    font-family:monospace;
    font-size:9px;
    letter-spacing:3px;
    opacity:.65;
}

#enter{
    margin-top:30px;

    padding:15px 21px;

    background:rgba(10,10,10,.25);
    color:white;

    border:1px solid rgba(255,255,255,.5);

    font-family:monospace;
    font-size:9px;
    letter-spacing:2px;

    cursor:pointer;

    backdrop-filter:blur(10px);

    transition:.25s;
}

#enter:hover{
    background:white;
    color:#111;
}


/* =========================
   LOCATION
========================= */

#location{
    position:fixed;
    left:35px;
    top:105px;

    z-index:20;

    font-family:monospace;
    font-size:9px;
    letter-spacing:2px;

    opacity:.7;

    pointer-events:none;
}

.locationDot{
    display:inline-block;
    width:5px;
    height:5px;
    border-radius:50%;
    background:#fff;
    margin-right:9px;
}


/* =========================
   QUESTION PANEL
========================= */

#panel{
    position:fixed;

    z-index:25;

    right:5vw;
    bottom:6vh;

    width:min(500px,90vw);

    padding:32px;

    background:rgba(15,17,17,.62);

    border:1px solid rgba(255,255,255,.16);

    backdrop-filter:blur(20px);

    transform:translateY(30px);
    opacity:0;

    pointer-events:none;

    transition:
        opacity .6s ease,
        transform .6s ease;
}

#panel.show{
    opacity:1;
    transform:translateY(0);
    pointer-events:auto;
}

.panelNumber{
    font-family:monospace;
    font-size:9px;
    opacity:.45;
    margin-bottom:18px;
}

.panelPlace{
    font-family:monospace;
    font-size:8px;
    letter-spacing:3px;
    opacity:.55;
    margin-bottom:12px;
}

#panel h2{
    font-family:Georgia,serif;
    font-weight:normal;
    font-size:clamp(32px,4vw,52px);
    line-height:.92;
}

#description{
    margin-top:22px;
    font-size:13px;
    line-height:1.7;
    color:rgba(255,255,255,.73);
}

.cards{
    margin-top:18px;

    display:grid;
    grid-template-columns:1fr 1fr;

    gap:7px;
}

.card{
    padding:11px;

    border:1px solid rgba(255,255,255,.12);

    background:rgba(255,255,255,.035);

    font-family:monospace;
    font-size:8px;

    color:rgba(255,255,255,.75);
}

#next{
    margin-top:22px;

    padding:12px 16px;

    border:none;

    background:white;
    color:#111;

    font-family:monospace;
    font-size:9px;
    letter-spacing:1px;

    cursor:pointer;
}


/* =========================
   MENU
========================= */

#menuButton{
    position:fixed;

    top:24px;
    right:35px;

    z-index:50;

    padding:10px 15px;

    border:1px solid rgba(255,255,255,.3);

    color:white;
    background:rgba(0,0,0,.15);

    font-family:monospace;
    font-size:9px;
    letter-spacing:2px;

    cursor:pointer;

    backdrop-filter:blur(10px);
}

#menu{
    position:fixed;
    z-index:100;

    top:0;
    right:0;

    height:100%;
    width:min(430px,90vw);

    background:rgba(9,11,12,.96);

    backdrop-filter:blur(25px);

    padding:90px 35px;

    transform:translateX(100%);

    transition:transform .55s ease;
}

#menu.open{
    transform:translateX(0);
}

#close{
    position:absolute;
    right:25px;
    top:22px;

    background:none;
    border:none;
    color:white;

    font-size:30px;

    cursor:pointer;
}

.menuTitle{
    font-family:monospace;
    font-size:9px;
    letter-spacing:4px;
    opacity:.45;
    margin-bottom:30px;
}

.menuItem{
    padding:18px 0;

    border-top:1px solid rgba(255,255,255,.1);

    cursor:pointer;

    display:flex;
    gap:18px;

    transition:.2s;
}

.menuItem:hover{
    padding-left:10px;
}

.menuNum{
    font-family:monospace;
    font-size:8px;
    opacity:.4;
}

.menuText{
    font-family:Georgia,serif;
    font-size:20px;
}


/* =========================
   TRANSITION
========================= */

#transition{
    position:fixed;
    inset:0;

    z-index:200;

    background:#070909;

    opacity:0;

    pointer-events:none;

    transition:opacity .45s ease;
}


/* =========================
   MOBILE
========================= */

@media(max-width:700px){

    #top{
        padding:18px 18px;
    }

    .logo{
        font-size:19px;
    }

    #menuButton{
        right:18px;
        top:18px;
    }

    #location{
        left:18px;
        top:78px;
    }

    #intro{
        left:24px;
        bottom:9vh;
        right:20px;
    }

    #intro h1{
        font-size:60px;
        letter-spacing:-3px;
    }

    #intro p{
        line-height:1.5;
        max-width:280px;
    }

    #panel{
        left:12px;
        right:12px;
        bottom:12px;

        width:auto;

        padding:23px;
        max-height:62vh;
        overflow:auto;
    }

    #panel h2{
        font-size:35px;
    }

    #description{
        font-size:12px;
        line-height:1.55;
    }

    .cards{
        grid-template-columns:1fr 1fr;
    }

    .card{
        font-size:8px;
    }

}


/* very small phones */

@media(max-width:390px){

    #intro h1{
        font-size:51px;
    }

    #panel{
        max-height:68vh;
    }

    .cards{
        grid-template-columns:1fr;
    }

}

</style>
</head>


<body>


<!-- =========================
     LOADING
========================= -->

<div id="loading">

    <div class="loadingTitle">
        STANFORD
    </div>

    <div class="loadingSubtitle">
        CALIFORNIA · USA
    </div>

    <div class="loadingBar">
        <span></span>
    </div>

</div>


<!-- =========================
     THREE.JS
========================= -->

<canvas id="scene"></canvas>


<!-- =========================
     HEADER
========================= -->

<div id="top">

    <div>

        <span class="logoSmall">
            STANFORD UNIVERSITY
        </span>

        <span class="logo">
            STANFORD
        </span>

    </div>

    <div id="chapter">
        00 / 07
    </div>

</div>


<button id="menuButton">
    MENU
</button>


<!-- =========================
     INTRO
========================= -->

<div id="intro">

    <div class="introSmall">
        CALIFORNIA · UNITED STATES
    </div>

    <h1>
        ENTER<br>
        <span>STANFORD</span>
    </h1>

    <p>
        AN IMMERSIVE CAMPUS EXPERIENCE
    </p>

    <button id="enter">
        ENTER CAMPUS →
    </button>

</div>


<!-- =========================
     LOCATION
========================= -->

<div id="location">

    <span class="locationDot"></span>

    <span id="locationText">
        PALM DRIVE
    </span>

</div>


<!-- =========================
     QUESTION
========================= -->

<div id="panel">

    <div class="panelNumber" id="panelNumber">
        01
    </div>

    <div class="panelPlace" id="panelPlace">
        MEMORIAL COURT
    </div>

    <h2 id="panelTitle">
        CAMPUS &<br>
        STUDENT LIFE
    </h2>

    <p id="description"></p>

    <div class="cards" id="cards"></div>

    <button id="next">
        CONTINUE →
    </button>

</div>


<!-- =========================
     MENU
========================= -->

<div id="menu">

    <button id="close">
        ×
    </button>

    <div class="menuTitle">
        EXPLORE CAMPUS
    </div>

    <div id="menuItems"></div>

</div>


<!-- =========================
     TRANSITION
========================= -->

<div id="transition"></div>


<script type="module">

/*
===========================================================
STANFORD IMMERSIVE CAMPUS
Stable mobile + desktop version
===========================================================
*/


/* =========================
   THREE.JS IMPORT
========================= */

import * as THREE from
"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";


/* =========================
   BASIC SETUP
========================= */

const canvas =
document.getElementById("scene");


const renderer =
new THREE.WebGLRenderer({

    canvas:canvas,

    antialias:true,

    alpha:false,

    powerPreference:"high-performance"

});


renderer.setPixelRatio(
Math.min(window.devicePixelRatio,1.5)
);


renderer.setSize(
window.innerWidth,
window.innerHeight
);


renderer.outputColorSpace =
THREE.SRGBColorSpace;


renderer.toneMapping =
THREE.ACESFilmicToneMapping;


renderer.toneMappingExposure =
1.05;


const scene =
new THREE.Scene();


/*
IMPORTANT:
Neutral California sky.
No red background.
*/

scene.background =
new THREE.Color(0x9db4bc);


/* =========================
   CAMERA
========================= */

const camera =
new THREE.PerspectiveCamera(

    window.innerWidth <
    700 ? 65 : 55,

    window.innerWidth /
    window.innerHeight,

    .1,

    1000

);


camera.position.set(
0,
6,
85
);


/* =========================
   LIGHTING
========================= */

const ambient =
new THREE.HemisphereLight(

    0xdcecff,
    0x586047,

    2.2

);

scene.add(ambient);


const sunlight =
new THREE.DirectionalLight(

    0xffe0b0,

    3

);

sunlight.position.set(
-80,
120,
70
);

scene.add(sunlight);


/* =========================
   WORLD
========================= */

const world =
new THREE.Group();

scene.add(world);


/* =========================
   MATERIALS
========================= */

const stone =
new THREE.MeshStandardMaterial({

    color:0xa88968,

    roughness:.9

});


const stoneDark =
new THREE.MeshStandardMaterial({

    color:0x725b48,

    roughness:.95

});


const roof =
new THREE.MeshStandardMaterial({

    color:0x713d2f,

    roughness:.85

});


const wood =
new THREE.MeshStandardMaterial({

    color:0x211814,

    roughness:.7

});


const glass =
new THREE.MeshStandardMaterial({

    color:0x7899a2,

    roughness:.2,

    metalness:.1

});


const grass =
new THREE.MeshStandardMaterial({

    color:0x536b42,

    roughness:1

});


const pathMaterial =
new THREE.MeshStandardMaterial({

    color:0xb6a58c,

    roughness:1

});


/* =========================
   GROUND
========================= */

const ground =
new THREE.Mesh(

    new THREE.PlaneGeometry(
        700,
        700
    ),

    grass

);

ground.rotation.x =
-Math.PI / 2;

world.add(ground);


/* =========================
   PATHS
========================= */

function makePath(
x,
z,
w,
d
){

    const p =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            w,
            .08,
            d
        ),

        pathMaterial

    );

    p.position.set(
        x,
        .04,
        z
    );

    world.add(p);

}


makePath(
0,
0,
20,
300
);


makePath(
0,
-105,
110,
18
);


makePath(
-65,
-55,
15,
110
);


/* =========================
   TREES
========================= */

function makeTree(
x,
z,
scale=1
){

    const group =
    new THREE.Group();


    const trunk =
    new THREE.Mesh(

        new THREE.CylinderGeometry(
            .28,
            .5,
            6,
            8
        ),

        new THREE.MeshStandardMaterial({
            color:0x614a38
        })

    );

    trunk.position.y=3;

    group.add(trunk);


    for(let i=0;i<5;i++){

        const crown =
        new THREE.Mesh(

            new THREE.SphereGeometry(
                2.8,
                8,
                6
            ),

            new THREE.MeshStandardMaterial({
                color:0x35503a
            })

        );

        crown.position.set(

            Math.cos(i)*1.7,

            6.3 + Math.sin(i)*.6,

            Math.sin(i)*1.7

        );

        crown.scale.y=.75;

        group.add(crown);

    }


    group.position.set(
        x,
        0,
        z
    );

    group.scale.setScalar(
        scale
    );

    world.add(group);

}


/* Palm Drive */

for(
let z=-145;
z<100;
z+=18
){

    makeTree(
        -15,
        z,
        1.15
    );

    makeTree(
        15,
        z,
        1.15
    );

}


/* Background */

for(
let i=0;
i<55;
i++
){

    const x =
    (Math.random()-.5)*300;

    const z =
    -150-Math.random()*170;

    makeTree(
        x,
        z,
        .55+Math.random()*.55
    );

}


/* =========================
   MAIN QUAD BUILDING
========================= */

function quadBuilding(
x,
z,
width,
depth
){

    const group =
    new THREE.Group();


    const body =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            width,
            13,
            depth
        ),

        stone

    );

    body.position.y=6.5;

    group.add(body);


    const roofMesh =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            width+1,
            1.8,
            depth+1
        ),

        roof

    );

    roofMesh.position.y=14;

    group.add(roofMesh);


    /*
    Arcade columns.
    */

    const number =
    Math.max(
        3,
        Math.floor(width/7)
    );


    for(
    let i=0;
    i<number;
    i++
    ){

        const px =
        -width/2+
        3+
        i*7;


        const column =
        new THREE.Mesh(

            new THREE.CylinderGeometry(
                .38,
                .5,
                8,
                10
            ),

            stoneDark

        );

        column.position.set(
            px,
            4,
            depth/2+.7
        );

        group.add(column);


        const arch =
        new THREE.Mesh(

            new THREE.TorusGeometry(
                2.5,
                .35,
                8,
                20,
                Math.PI
            ),

            stoneDark

        );

        arch.rotation.z=
        Math.PI;

        arch.position.set(
            px+2.7,
            8,
            depth/2+.7
        );

        group.add(arch);

    }


    group.position.set(
        x,
        0,
        z
    );

    world.add(group);

}


/*
Main Quad.
*/

quadBuilding(
-32,
-45,
70,
20
);

quadBuilding(
32,
-45,
70,
20
);

quadBuilding(
-32,
-83,
70,
20
);

quadBuilding(
32,
-83,
70,
20
);


/* =========================
   DOOR
========================= */

function door(
parent,
x,
z
){

    const frame =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            5.8,
            8.5,
            .6
        ),

        stoneDark

    );

    frame.position.set(
        x,
        4.25,
        z
    );

    parent.add(frame);


    const d =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            4.2,
            7.5,
            .35
        ),

        wood

    );

    d.position.set(
        x,
        3.75,
        z+.4
    );

    parent.add(d);

}


/* =========================
   MEMORIAL CHURCH
========================= */

function memorialChurch(){

    const group =
    new THREE.Group();


    const body =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            34,
            17,
            27
        ),

        stone

    );

    body.position.y=8.5;

    group.add(body);


    const roofTop =
    new THREE.Mesh(

        new THREE.ConeGeometry(
            25,
            12,
            4
        ),

        roof

    );

    roofTop.rotation.y=
    Math.PI/4;

    roofTop.scale.z=.75;

    roofTop.position.y=22;

    group.add(roofTop);


    /*
    Central tower.
    */

    const tower =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            8,
            30,
            8
        ),

        stone

    );

    tower.position.set(
        0,
        15,
        -13
    );

    group.add(tower);


    const towerRoof =
    new THREE.Mesh(

        new THREE.ConeGeometry(
            6,
            9,
            4
        ),

        roof

    );

    towerRoof.rotation.y=
    Math.PI/4;

    towerRoof.position.set(
        0,
        34,
        -13
    );

    group.add(towerRoof);


    /*
    Entrance.
    */

    door(
        group,
        0,
        14
    );


    group.position.set(
        0,
        0,
        -115
    );


    world.add(group);

}


memorialChurch();


/* =========================
   HOOVER TOWER
========================= */

function hooverTower(){

    const group =
    new THREE.Group();


    const tower =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            13,
            70,
            13
        ),

        new THREE.MeshStandardMaterial({

            color:0x77756e,

            roughness:.8

        })

    );

    tower.position.y=35;

    group.add(tower);


    /*
    Stepped upper section.
    */

    const upper =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            17,
            9,
            17
        ),

        stoneDark

    );

    upper.position.y=74;

    group.add(upper);


    const roofTop =
    new THREE.Mesh(

        new THREE.ConeGeometry(
            11,
            12,
            8
        ),

        roof

    );

    roofTop.position.y=84;

    group.add(roofTop);


    /*
    Windows.
    */

    for(
    let y=9;
    y<64;
    y+=7
    ){

        for(
        let x=-3.5;
        x<=3.5;
        x+=3.5
        ){

            const win =
            new THREE.Mesh(

                new THREE.BoxGeometry(
                    1.1,
                    2.3,
                    .15
                ),

                glass

            );

            win.position.set(
                x,
                y,
                6.6
            );

            group.add(win);

        }

    }


    door(
        group,
        0,
        6.8
    );


    group.position.set(
        65,
        0,
        -72
    );


    world.add(group);

}


hooverTower();


/* =========================
   OTHER BUILDINGS
========================= */

function simpleBuilding(
x,
z,
w,
d,
h
){

    const group =
    new THREE.Group();


    const body =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            w,
            h,
            d
        ),

        stone

    );

    body.position.y=
    h/2;

    group.add(body);


    const roofMesh =
    new THREE.Mesh(

        new THREE.BoxGeometry(
            w+1,
            1.7,
            d+1
        ),

        roof

    );

    roofMesh.position.y=
    h+1;

    group.add(roofMesh);


    /*
    Windows.
    */

    for(
    let i=0;
    i<Math.floor(w/4);
    i++
    ){

        const win =
        new THREE.Mesh(

            new THREE.BoxGeometry(
                1.5,
                2,
                .15
            ),

            glass

        );

        win.position.set(

            -w/2+
            3+
            i*4,

            h*.58,

            d/2+.1

        );

        group.add(win);

    }


    door(
        group,
        0,
        d/2+.25
    );


    group.position.set(
        x,
        0,
        z
    );


    world.add(group);

}


/* Admissions */

simpleBuilding(
-72,
20,
34,
23,
15
);


/* Residence */

simpleBuilding(
70,
25,

/* =========================
   CAMERA ANIMATION
========================= */

let animationId=null;


function moveCamera(
position,
target,
duration=1800
){

    const startPos =
    camera.position.clone();

    const startTarget =
    new THREE.Vector3(
        0,
        0,
        0
    );


    startTarget.copy(
        controlsTarget
    );


    const endPos =
    new THREE.Vector3(
        position[0],
        position[1],
        position[2]
    );


    const endTarget =
    new THREE.Vector3(
        target[0],
        target[1],
        target[2]
    );


    const start =
    performance.now();


    function animateCamera(time){

        let p =
        (time-start)/duration;

        p=
        Math.max(
            0,
            Math.min(
                1,
                p
            )
        );


        /*
        Smooth cinematic easing.
        */

        const eased =
        p<.5
        ?
        4*p*p*p
        :
        1-
        Math.pow(
            -2*p+2,
            3
        )/2;


        camera.position.lerpVectors(
            startPos,
            endPos,
            eased
        );


        controlsTarget.lerpVectors(
            startTarget,
            endTarget,
            eased
        );


        camera.lookAt(
            controlsTarget
        );


        if(p<1){

            animationId=
            requestAnimationFrame(
                animateCamera
            );

        }

    }


    cancelAnimationFrame(
        animationId
    );


    animationId=
    requestAnimationFrame(
        animateCamera
    );

}


/*
We intentionally use a lightweight
custom touch/drag camera instead
of OrbitControls.
This makes mobile much more reliable.
*/

let controlsTarget =
new THREE.Vector3(
0,
7,
0
);


let dragging=false;

let lastX=0;
let lastY=0;

let yaw=0;
let pitch=0;


function lookAround(dx,dy){

    yaw-=dx*.0025;

    pitch-=dy*.0025;

    pitch=
    Math.max(
        -.8,
        Math.min(
            .5,
            pitch
        )
    );


    const distance=14;


    const target =
    new THREE.Vector3(

        camera.position.x+
        Math.sin(yaw)*distance,

        camera.position.y+
        pitch*8,

        camera.position.z+
        Math.cos(yaw)*distance

    );


    camera.lookAt(
        target
    );

}


/* Touch */

canvas.addEventListener(
"touchstart",
e=>{

    if(e.touches.length!==1)
        return;

    dragging=true;

    lastX=
    e.touches[0].clientX;

    lastY=
    e.touches[0].clientY;

},
{passive:false}
);


canvas.addEventListener(
"touchmove",
e=>{

    if(!dragging)
        return;

    e.preventDefault();

    const x=
    e.touches[0].clientX;

    const y=
    e.touches[0].clientY;

    const dx=
    x-lastX;

    const dy=
    y-lastY;

    lookAround(
        dx,
        dy
    );

    lastX=x;
    lastY=y;

},
{passive:false}
);


canvas.addEventListener(
"touchend",
()=>{

    dragging=false;

}
);


/* Mouse */

canvas.addEventListener(
"mousedown",
e=>{

    dragging=true;

    lastX=e.clientX;
    lastY=e.clientY;

});


window.addEventListener(
"mousemove",
e=>{

    if(!dragging)
        return;

    lookAround(
        e.clientX-lastX,
        e.clientY-lastY
    );

    lastX=e.clientX;
    lastY=e.clientY;

});


window.addEventListener(
"mouseup",
()=>{

    dragging=false;

});

========================= */

function showChapter(i){

    current=
    (i+chapters.length)%
    chapters.length;


    const data=
    chapters[current];


    number.textContent=
    data.number;

    chapter.textContent=
    data.number+
    " / 07";

    place.textContent=
    data.place;

    location.textContent=
    data.place;

    title.innerHTML=
    data.title;

    description.textContent=
    data.description;


    cards.innerHTML="";


    data.cards.forEach(
    item=>{

        const c=
        document.createElement(
            "div"
        );

        c.className="card";

        c.textContent=item;

        cards.appendChild(c);

    });


    panel.classList.add(
        "show"
    );


    moveCamera(
        data.camera,
        data.target
    );

}


/* =========================

========================= */

    transition.style.opacity="1";


    setTimeout(
    ()=>{

        showChapter(i);

        setTimeout(
        ()=>{

            transition.style.opacity="0";

        },
        100
        );

    },
    450
    );

}

    );

});
